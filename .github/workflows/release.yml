name: Release

on:
  push:
    tags:
      - "moonli-v*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.23.x"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5
      - name: Validate tag and source
        id: version
        run: |
          version="${GITHUB_REF_NAME#moonli-v}"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          test "$(git tag --points-at HEAD --list "$GITHUB_REF_NAME")" = "$GITHUB_REF_NAME"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Install locked dependencies and test
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          sh scripts/pre-push.sh
          docker compose config --quiet
      - name: Fetch and verify pinned updater source
        run: |
          git clone --filter=blob:none https://github.com/psewdon1m-exocortex/updater.git /tmp/moonli-updater
          git -C /tmp/moonli-updater checkout --detach 75eff9607dac4f7dbe9f841bd428f53ee01274a1
          test "$(git -C /tmp/moonli-updater rev-parse HEAD)" = "75eff9607dac4f7dbe9f841bd428f53ee01274a1"
          git -C /tmp/moonli-updater apply --check "$GITHUB_WORKSPACE/deploy/updater-moonli.patch"
          git -C /tmp/moonli-updater apply "$GITHUB_WORKSPACE/deploy/updater-moonli.patch"
          cd /tmp/moonli-updater
          go test ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags '-s -w -X main.version=0.2.1-moonli.1' -o updater-linux-amd64 ./cmd/updater
      - name: Build and publish the application once
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: true
          tags: ghcr.io/psewdon1m-moonli/backend:moonli-v${{ steps.version.outputs.value }}
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
      - name: Sign immutable image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "ghcr.io/psewdon1m-moonli/backend@$DIGEST"
      - name: Smoke-test the published digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker run --detach --name moonli-release-smoke --publish 127.0.0.1:18001:8000 \
            --env MOONLI_ENV=production --env MOONLI_ALLOWED_HOSTS=127.0.0.1 \
            --env MOONLI_CLIENT_API_KEYS=release-smoke-client-key-01 \
            --env MOONLI_OPERATOR_ACCESS_KEY=release-smoke-operator-key-01 \
            --env MOONLI_IMAGE_PROVIDER=google \
            --env MOONLI_TRANSCRIPTION_PROVIDER=google \
            --env MOONLI_NORMALIZATION_PROVIDER=google \
            --env MOONLI_GOOGLE_IMAGE_MODEL=release-smoke-image-model \
            --env MOONLI_GOOGLE_TRANSCRIPTION_MODEL=release-smoke-transcription-model \
            --env MOONLI_GOOGLE_NORMALIZATION_MODEL=release-smoke-normalization-model \
            "ghcr.io/psewdon1m-moonli/backend@$DIGEST"
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --header 'Host: 127.0.0.1' http://127.0.0.1:18001/readyz; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then docker logs --tail 100 moonli-release-smoke; exit 1; fi
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --header 'Host: 127.0.0.1' http://127.0.0.1:18001/internal/test/config)" = "401"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --header 'Host: 127.0.0.1' http://127.0.0.1:18001/internal/routing)" = "401"
          login="$(curl --fail --silent --show-error --cookie-jar /tmp/moonli-release.cookies \
            --header 'Host: 127.0.0.1' --header 'Content-Type: application/json' \
            --data '{"access_key":"release-smoke-operator-key-01"}' \
            http://127.0.0.1:18001/internal/auth/session)"
          csrf="$(printf '%s' "$login" | python -c 'import json,sys; print(json.load(sys.stdin)["csrf_token"])')"
          curl --fail --silent --show-error --cookie /tmp/moonli-release.cookies \
            --header 'Host: 127.0.0.1' --header "X-CSRF-Token: $csrf" \
            --header 'Idempotency-Key: release-production-full-run-0001' \
            --form type=text --form pipeline=pipeline-3 --form text='cute fox icon' \
            --form image_provider=mock --form transcription_provider=mock \
            --form normalization_provider=mock \
            http://127.0.0.1:18001/internal/test/pipeline \
            --output /tmp/moonli-release-test-run.zip
          python -c "import json,zipfile; archive=zipfile.ZipFile('/tmp/moonli-release-test-run.zip'); manifest=json.loads(archive.read('manifest.json')); assert manifest['pipeline']=='pipeline-3' and manifest['input_type']=='text'"
      - name: Create checksummed release contract
        env:
          UPDATER_SOURCE_DIR: /tmp/moonli-updater
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          bash scripts/build-release.sh "${GITHUB_REF_NAME#moonli-v}" "$DIGEST" release-artifacts
      - name: Attest release bundle
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: release-artifacts/moonli-compose.tar.gz
      - name: Publish assets on the existing tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes \
            release-artifacts/moonli-release.json \
            release-artifacts/moonli-release.json.sha256 \
            release-artifacts/moonli-compose.tar.gz \
            release-artifacts/moonli-compose.tar.gz.sha256
      - name: Stop smoke container
        if: always()
        run: docker rm --force moonli-release-smoke 2>/dev/null || true
