name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked development dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Verify source and contracts
        run: |
          python -m ruff check app tests scripts
          python -m pytest -q
          python -m compileall -q app scripts
          node --check app/web/app.js
          python scripts/security_scan.py
          python scripts/verify_contract.py
          docker compose config --quiet
      - name: Build application image
        run: docker build --pull --tag moonli-ci:${{ github.sha }} .
      - name: Inspect final image for forbidden inputs
        run: |
          docker history --no-trunc moonli-ci:${{ github.sha }} > /tmp/moonli-history.txt
          if grep -E 'MOONLI_GOOGLE_API_KEY|TABLE_GEN_NANO_BANANA_PRO_API_KEY|BEGIN.*PRIVATE KEY' /tmp/moonli-history.txt; then exit 1; fi
          container_id="$(docker create moonli-ci:${{ github.sha }})"
          docker export "$container_id" --output /tmp/moonli-image.tar
          docker rm "$container_id"
          mkdir /tmp/moonli-image
          tar -xf /tmp/moonli-image.tar -C /tmp/moonli-image
          test ! -e /tmp/moonli-image/app/.env
          if grep -R -E --binary-files=without-match 'AIza[0-9A-Za-z_-]{30,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' /tmp/moonli-image/app; then exit 1; fi
      - name: Compose health and exposure smoke test
        env:
          MOONLI_HTTP_PORT: "18080"
          MOONLI_HTTPS_PORT: "18443"
          MOONLI_LOOPBACK_API_PORT: "18000"
          MOONLI_TLS_CERTS_PATH: /tmp/moonli-ci-certs
          MOONLI_ENV: production
          MOONLI_ALLOWED_HOSTS: localhost,127.0.0.1
          MOONLI_CLIENT_API_KEYS: ci-production-client-key-01
          MOONLI_OPERATOR_ACCESS_KEY: ci-production-operator-key-01
          MOONLI_IMAGE_PROVIDER: google
          MOONLI_TRANSCRIPTION_PROVIDER: google
          MOONLI_NORMALIZATION_PROVIDER: google
          MOONLI_GOOGLE_IMAGE_MODEL: ci-image-model
          MOONLI_GOOGLE_TRANSCRIPTION_MODEL: ci-transcription-model
          MOONLI_GOOGLE_NORMALIZATION_MODEL: ci-normalization-model
        run: |
          mkdir -p "$MOONLI_TLS_CERTS_PATH"
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout "$MOONLI_TLS_CERTS_PATH/privkey.pem" \
            -out "$MOONLI_TLS_CERTS_PATH/fullchain.pem" \
            -subj '/CN=localhost' >/dev/null 2>&1
          docker compose up --build -d --wait
          base_url='https://127.0.0.1:18443'
          curl --fail --silent --show-error --insecure --header 'Host: localhost' "$base_url/health"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --insecure --header 'Host: localhost' https://127.0.0.1:18443/docs)" = "404"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --insecure --header 'Host: localhost' https://127.0.0.1:18443/metrics)" = "404"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --insecure --header 'Host: invalid.example' https://127.0.0.1:18443/health)" = "421"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --insecure --header 'Host: localhost' "$base_url/internal/test/config")" = "401"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --insecure --header 'Host: localhost' "$base_url/internal/routing")" = "401"
          docker exec moonli-vless-proxy /usr/local/bin/xray run -test \
            -config /run/moonli-secrets/xray-routing.json
          login="$(curl --fail --silent --show-error --insecure --cookie-jar /tmp/moonli-ci.cookies \
            --header 'Host: localhost' --header 'Content-Type: application/json' \
            --data '{"access_key":"ci-production-operator-key-01"}' \
            "$base_url/internal/auth/session")"
          csrf="$(printf '%s' "$login" | python -c 'import json,sys; print(json.load(sys.stdin)["csrf_token"])')"
          curl --fail --silent --show-error --insecure --cookie /tmp/moonli-ci.cookies \
            --header 'Host: localhost' "$base_url/internal/test/config" >/tmp/moonli-test-config.json
          curl --fail --silent --show-error --insecure --cookie /tmp/moonli-ci.cookies \
            --header 'Host: localhost' --header "X-CSRF-Token: $csrf" \
            --header 'Content-Type: application/json' \
            --data '{"provider":"mock","text":"production test call"}' \
            "$base_url/internal/test/normalize" >/tmp/moonli-test-normalize.json
          curl --fail --silent --show-error --insecure --cookie /tmp/moonli-ci.cookies \
            --header 'Host: localhost' --header "X-CSRF-Token: $csrf" \
            --header 'Idempotency-Key: ci-production-full-run-0001' \
            --form type=text --form pipeline=pipeline-3 --form text='cute fox icon' \
            --form image_provider=mock --form transcription_provider=mock \
            --form normalization_provider=mock \
            "$base_url/internal/test/pipeline" --output /tmp/moonli-test-run.zip
          python - <<'PY'
          import json
          import zipfile

          assert json.load(open('/tmp/moonli-test-config.json', encoding='utf-8'))['environment'] == 'production'
          assert json.load(open('/tmp/moonli-test-normalize.json', encoding='utf-8'))['normalized_text'] == 'production test call'
          with zipfile.ZipFile('/tmp/moonli-test-run.zip') as archive:
              manifest = json.loads(archive.read('manifest.json'))
          assert manifest['pipeline'] == 'pipeline-3'
          assert manifest['input_type'] == 'text'
          PY
      - name: Bounded failure diagnostics
        if: failure()
        run: docker compose logs --tail 100 vless-proxy api gateway
      - name: Stop test stack
        if: always()
        run: docker compose down --volumes --remove-orphans
